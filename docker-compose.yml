version: '3.4'

services:
  new-api:
    # 既然你本地有源码且经常修改，用 build 模式最聪明
    build: . 
    container_name: NewAPI
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 【核心配置】确保密码正确，gmk-g3 指向你的宿主机
      - SQL_DSN=root:你的密码@tcp(gmk-g3:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://redis
      - DATABASE_TYPE=mysql
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      - redis

  # 保留 Redis，它是 NewAPI 的“短期记忆”
  redis:
    image: redis:alpine
    container_name: Redis-Cache
    restart: always

networks:
  default:
    name: newapi_network